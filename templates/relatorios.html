<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISEPAM — Relatórios</title>
    <script>const t=localStorage.getItem('tema')||'light';document.documentElement.setAttribute('data-theme',t);</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="sidebar-brand">
            <h2>Patrimônio</h2>
            <p id="usuario-nome">Carregando...</p>
        </div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="dashboard.html">Dashboard</a>
            <a class="nav-item" href="inventario.html">Inventário</a>
            <a class="nav-item" href="cadastrar-bem.html">Cadastrar</a>
            <a class="nav-item" href="chamados.html">Chamados</a>
            <a class="nav-item active" href="relatorios.html">Relatórios</a>
        </nav>
        <div class="sidebar-footer">
            <button class="theme-toggle" onclick="alternarTema()">🌙 Modo Escuro</button>
            <a class="nav-item sair" onclick="sair()">Sair</a>
        </div>
    </aside>

    <main class="main">
        <h1 class="page-title">Relatórios</h1>

        <div class="form-card">
            <div class="abas-relatorio">
                <button class="aba active" onclick="trocarAba('patrimonio', this)">Patrimônio</button>
                <button class="aba" onclick="trocarAba('chamados', this)">Chamados</button>
                <button class="aba" onclick="trocarAba('atividades', this)">Atividades</button>
                <button class="aba" onclick="trocarAba('estatisticas', this)">Estatísticas</button>
            </div>

            <div id="conteudo-relatorio" style="margin-top: 24px;">
                <div style="display: flex; gap: 16px; margin-bottom: 20px;">
                    <div>
                        <label style="font-size: 12px; color: var(--text-mid); display: block; margin-bottom: 4px;">De:</label>
                        <input type="date" id="data-inicio" style="padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: var(--font); font-size: 13px; outline: none;" />
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--text-mid); display: block; margin-bottom: 4px;">Até:</label>
                        <input type="date" id="data-fim" style="padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-family: var(--font); font-size: 13px; outline: none;" />
                    </div>
                </div>

                <div class="form-group">
                    <select id="categoria-relatorio">
                        <option>Todas Categorias</option>
                        <option>Mobiliário</option>
                        <option>Eletrônico</option>
                        <option>Veículo</option>
                        <option>Equipamento</option>
                    </select>
                </div>

                <div class="form-group">
                    <select id="estado-relatorio">
                        <option>Todos Estados</option>
                        <option>Novo</option>
                        <option>Bom</option>
                        <option>Regular</option>
                        <option>Ruim</option>
                    </select>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 8px;">
                    <button class="btn-save" onclick="visualizarRelatorio()" style="background: white; color: var(--text-dark); border: 1.5px solid var(--border);">Visualizar na Tela</button>
                    <button class="btn-save" onclick="baixarPDF()" style="background: #7c3aed;">📄 Baixar PDF Patrimônio</button>
                </div>
            </div>
        </div>
    </main>
</div>

<style>
.abas-relatorio {
    display: flex;
    gap: 0;
    border-bottom: 2px solid var(--border);
    margin-bottom: 4px;
}

.aba {
    padding: 10px 20px;
    background: none;
    border: none;
    font-size: 14px;
    font-family: var(--font);
    font-weight: 500;
    color: var(--text-mid);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
}

.aba:hover { color: var(--accent); }

.aba.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}
</style>

<script src="script.js"></script>
<script>
function trocarAba(nome, btn) {
    document.querySelectorAll('.aba').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function visualizarRelatorio() {
    alert('Funcionalidade em desenvolvimento.');
}

function baixarPDF() {
    alert('Funcionalidade em desenvolvimento.');
}
</script>
</body>
</html>
